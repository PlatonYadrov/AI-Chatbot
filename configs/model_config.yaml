embedding:
  model_name: intfloat/e5-base
  dimensionality: 768

llm:
  model_name: cognitivecomputations/Qwen3-30B-A3B-AWQ
  max_tokens: 512

chunking:
  strategy: token_aware  # Options: token_aware, recursive, semantic
  chunk_size_tokens: 300
  overlap_tokens: 75
  min_chunk_tokens: 50
  max_chunk_tokens: 512

reranking:
  model_name: langchain-compression
  device: auto  # Options: auto, cuda, cpu
  max_length: 512
  batch_size: 16
  enabled: true
  use_langchain: true  # Use LangChain compression pipeline
