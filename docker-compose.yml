services:
  ingestion:
    build: ./services/ingestion
    env_file:
      - ./configs/dev.env
    ports:
      - "0.0.0.0:6000:6000"
    volumes:
      - rag_data:/data
      # Mount Docling model cache for offline operation
      - docling_models:/app/.cache/huggingface
      # Mount output directory for processed documents (MD files)
      - ./output/processed_docs:/data/processed
    environment:
      # Docling local configuration
      - DOCLING_OFFLINE_MODE=true
      - DOCLING_OCR_ENABLED=true
      - DOCLING_EXTRACT_TABLES=true
      - DOCLING_CACHE_DIR=/app/.cache/huggingface
      - HF_HOME=/app/.cache/huggingface
      - TRANSFORMERS_CACHE=/app/.cache/huggingface
      - TESSDATA_PREFIX=/usr/share/tesseract-ocr/5/tessdata/
      # VLM disabled by default - uncomment if you have spare VRAM
      # - CUDA_VISIBLE_DEVICES=1
      # Docling Chunking (structure-aware) - set to true for better RAG quality
      - USE_DOCLING_CHUNKING=false
      - CHUNKING_MAX_TOKENS=450   # multilingual-e5-large: 512 tokens limit
      - CHUNKING_OVERLAP=100
      - CHUNKING_TOKENIZER=intfloat/multilingual-e5-large  # Auto-detected from EMBEDDINGS_MODEL
    # deploy:  # VLM disabled to save VRAM for vLLM
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           device_ids: ['1']
    #           capabilities: [gpu]
    depends_on:
      - embeddings
      - ocr
  online_rag:
    build: ./services/online-rag
    env_file:
      - ./configs/dev.env
    ports:
      - "0.0.0.0:7000:7000"
    volumes:
      - rag_data:/data
    depends_on:
      - llm
      - qdrant
      - reranker
      - postgres
  reranker:
    # Custom reranker service using sentence-transformers (reliable, works everywhere)
    build:
      context: ./services/reranker
      dockerfile: Dockerfile
    env_file:
      - ./configs/dev.env
    ports:
      - "0.0.0.0:8081:8081"
    volumes:
      - hf_cache:/app/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  admin_portal:
    build: ./services/admin-portal
  ocr:
    build: ./services/ocr
    ports:
      - "0.0.0.0:9000:9000"
  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "0.0.0.0:6333:6333"
    volumes:
        - qdrant_storage:/qdrant/storage
  postgres:
    build:
      context: ./infrastructure/postgres
      dockerfile: Dockerfile
    environment:
      - POSTGRES_USER=rag_user
      - POSTGRES_PASSWORD=rag_password
      - POSTGRES_DB=rag_chatbot
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_chatbot"]
      interval: 10s
      timeout: 5s
      retries: 5
  llm:
    image: vllm/vllm-openai:v0.10.0
    environment:
      - VLLM_USE_V1=0
      - CUDA_VISIBLE_DEVICES=0,1
    command: >-
      --model t-tech/T-pro-it-2.0-AWQ
      --tensor-parallel-size 2
      --dtype half
      --max-model-len 32768
      --disable-log-requests
      --no-enable-prefix-caching
      --download-dir /root/.cache
      --max-num-seqs 8
      --max-num-batched-tokens 33000
      --gpu-memory-utilization 0.80
    ports:
      - "0.0.0.0:8000:8000"
    shm_size: 32g
    ipc: host
    volumes:
      - /mnt/hf_cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0', '1']  # vLLM on both L4 GPUs
              capabilities: [gpu]
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-sha-a593f66
    environment:
      - CUDA_VISIBLE_DEVICES=0
    command: >-
      --model-id intfloat/multilingual-e5-large
      --dtype float16
      --max-batch-tokens 16384
      --auto-truncate
    ports:
      - "0.0.0.0:8080:80"
    volumes:
      - hf_cache:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']  # Embeddings on GPU 1 (~2GB VRAM)
              capabilities: [gpu]

  confluence_sync:
    build:
      context: .
      dockerfile: ./services/confluence-sync/Dockerfile
    environment:
      # Confluence
      - HOST=https://wiki.hg.loc
      - PAGE_ID=51828096
      - TOKEN=${TOKEN}
      - VERIFY_SSL=false

      # Ingestion API (внутренняя сеть compose)
      - INGEST_URL=http://ingestion:6000/ingest

      # Postgres (async SQLAlchemy/asyncpg)
      - DATABASE_URL=postgresql+asyncpg://rag_user:rag_password@postgres:5432/rag_chatbot

      # Логирование и таймзона для cron
      - LOG_LEVEL=INFO
      - TZ=Europe/Moscow
    depends_on:
      - ingestion
      - postgres
    restart: unless-stopped

volumes:
  hf_cache:
  rag_data:
  qdrant_storage:
  postgres_data:
  docling_models:  # Persistent storage for Docling models (local, no external API)